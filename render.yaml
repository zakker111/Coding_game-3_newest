databases:
  - name: nowt-db
    databaseName: nowt
    user: nowt
    plan: free

services:
  - type: web
    name: nowt-game
    runtime: node
    plan: free
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build
    startCommand: node apps/server/src/index.js
    healthCheckPath: /api/ruleset
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: HOST
        value: "0.0.0.0"
      - key: NOWT_WEB_DIST
        value: apps/web/dist
      - key: NODE_ENV
        value: production
      - key: NOWT_TRUST_PROXY
        value: "1"
      - key: NOWT_ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: nowt-db
          property: connectionString
